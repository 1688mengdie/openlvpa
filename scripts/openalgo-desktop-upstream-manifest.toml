[dependencies.aws-config]
version = "1"
optional = true

[dependencies.aws-credential-types]
version = "1"
optional = true

[dependencies.aws-sigv4]
version = "1"
optional = true

[dependencies.base64]
version = "0.23.0"

[dependencies.bytes]
version = "1.6"

[dependencies.derive_more]
version = "2"
features = [
    "from",
    "display",
]

[dependencies.futures]
version = "0.3"

[dependencies.macro_rules_attribute]
version = "0.2.2"

[dependencies.mime_guess]
version = "2"

[dependencies.pastey]
version = "0.2"

[dependencies.regex]
version = "1"

[dependencies.reqwest]
version = "0.13"
features = [
    "json",
    "stream",
    "gzip",
    "charset",
    "http2",
]
default-features = false

[dependencies.serde]
version = "1"
features = [
    "derive",
    "rc",
]

[dependencies.serde_json]
version = "1"

[dependencies.serde_with]
version = "3"

[dependencies.strum]
version = "0.28"
features = ["derive"]

[dependencies.tokio]
version = "1"
features = [
    "macros",
    "rt-multi-thread",
    "io-std",
    "test-util",
    "io-util",
    "time",
]

[dependencies.tokio-stream]
version = "0.1"

[dependencies.tracing]
version = "0.1"
features = ["default"]

[dependencies.uuid]
version = "1.21.0"
features = ["v4"]

[dependencies.value-ext]
version = "0.1.3"

[dev-dependencies.base64]
version = "0.23.0"

[dev-dependencies.bitflags]
version = "2.8"

[dev-dependencies.gcp_auth]
version = "0.12"

[dev-dependencies.http-body-util]
version = "0.1"

[dev-dependencies.hyper]
version = "1"
features = [
    "http1",
    "server",
]

[dev-dependencies.hyper-util]
version = "0.1"
features = [
    "tokio",
    "http1",
]

[dev-dependencies.schemars]
version = "1.2.1"

[dev-dependencies.serial_test]
version = "4"

[dev-dependencies.simple-fs]
version = "0.12"

[dev-dependencies.tracing-subscriber]
version = "0.3"
features = ["env-filter"]

[lints.rust]
unsafe_code = "forbid"
