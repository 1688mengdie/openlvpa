resolver = "2"

# Shared package metadata — single source of truth for version
[workspace.package]
version = "1.0.12" # x-release-please-version
authors = ["OpenBitFun Team"]
edition = "2021"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unexpected_cfgs = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"

# Shared dependency versions to keep all crates aligned
[workspace.dependencies]
pkg-config = "0.3"
x11rb = { version = "0.13", default-features = false }
# Async runtime
tokio = { version = "1.52", default-features = false }
tokio-stream = { version = "0.1.18", default-features = false }
tokio-util = "0.7.18"
async-trait = "0.1.89"
futures = { version = "0.3.31", default-features = false, features = ["std"] }
futures-util = "0.3.31"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonrepair-rs = { version = "0.2.6", default-features = false }
serde_yaml = "0.9"

# Document conversion
anydoc = "=0.2.4"
pdf-inspector = { version = "1.17.0", default-features = false }
roxmltree = { version = "0.21.1", default-features = false }

# TypeScript binding generation (schema-first; gated by per-crate `ts` features)
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }

# Error handling
anyhow = "1.0"
thiserror = "2"

# Logging
log = "0.4"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
chrono-tz = "0.10.4"
cron = "0.15.0"
# Tauri 2.9.2 utilities conflict with time 0.3.48 on current stable Rust.
time = { version = "=0.3.47", default-features = false }
# brotli-decompressor 5.0.2 / alloc-stdlib 0.2.3 pull alloc-no-stdlib 3.x while brotli still uses 2.x.
brotli-decompressor = "=5.0.0"
alloc-no-stdlib = "=2.0.4"
alloc-stdlib = "=0.2.2"
regex = "1"
tokenizers = { version = "0.22.2", default-features = false }
base64 = "0.22"
# Keep macOS Tauri's dispatch2/bitflags expansion on the known-good bitflags release.
bitflags = "=2.11.1"
image = { version = "0.25", default-features = false }
md5 = "0.7"
dashmap = "6"
indexmap = "2"
include_dir = "0.7"
aes = "0.8"
hmac = "0.12"
lettre = { version = "0.11.23", default-features = false }
hex = "0.4"
chardetng = "0.1.17"
encoding_rs = "0.8.35"
url = "2"

# HTTP client
reqwest = { version = "0.13.4", default-features = false }
semver = "1.0"

# Debug Log HTTP Server
axum = { version = "0.8", features = ["json"] }
tower-http = "0.6.11"

# File system
glob = "0.3"
ignore = "0.4"
mime_guess = "2.0"
notify = "8.2"
dirs = "6.0"
keyring-core = "1.0.0"
apple-native-keyring-store = { version = "1.0.1", features = ["keychain"] }
windows-native-keyring-store = "1.1.0"
zbus-secret-service-keyring-store = { version = "1.0.0", features = ["crypto-rust"] }
dark-light = "1.1"
dunce = "1"
filetime = "0.2"
fs2 = "0.4"
zip = { version = "4.6", default-features = false, features = ["deflate"] } # archive extraction
flate2 = "1.0"
tar = "0.4"
bzip2 = "0.5"
xz2 = "0.1"
zstd = "0.13"
toml = "0.9"

# Git
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }

# Terminal
portable-pty = "0.8"
vte = "0.15.0"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
unicode-width = "0.2"
pulldown-cmark = { version = "0.11", default-features = false }
math-core = { version = "0.6", default-features = false }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }
once_cell = "1"
libc = "0.2"
arboard = "3"
shlex = "1.3"
winsplit = "0.1"

# Grep (search)
grep-searcher = "0.1"
grep-regex = "0.1"
globset = "0.4"

# SSE
eventsource-stream = "0.2.3"
sse-stream = "0.2.3"

# Command detection (cross-platform)
which = "8.0"
similar = "2.5"
urlencoding = "2.1"
oxc = { version = "0.138.0", default-features = false, features = ["ast_visit", "codegen", "semantic", "transformer"] }
oxc-parse = { package = "oxc", version = "0.138.0", default-features = false }
sqlx = { version = "0.8", default-features = false }
rusqlite = { version = "0.32", default-features = false }

# Tauri (desktop only)
tauri = { version = "2.11" }
wry = { version = "0.56.0", default-features = false }
tauri-plugin-opener = "2.5"
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"
tauri-plugin-log = "2.8"
tauri-plugin-autostart = "2.5"
tauri-plugin-notification = "2.3"
tauri-plugin-updater = "2.10"
tauri-plugin-single-instance = "2.4"
# 2.4+ requires tauri 2.12, which pulls webview2-com 0.39 and breaks the
# webview2-com 0.38 COM types openbitfun-webdriver is built against.
tauri-plugin-clipboard-manager = "~2.3.3"
notify-rust = { version = "4.18", default-features = false }
tauri-build = { version = "2.6", features = [] }
keepawake = "0.6.0"

# Desktop support
screenshots = "0.8"
enigo = { version = "0.2", default-features = false }
resvg = { version = "0.47", default-features = false }
atspi = "0.29"
cc = { version = "1", default-features = false }
core-foundation = "0.9"
core-graphics = { version = "0.23", features = ["elcapitan", "highsierra"] }
foreign-types = "0.5"
dispatch = "0.2"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false }
objc2-app-kit = { version = "0.3", default-features = false }
objc2-vision = { version = "0.3.2", default-features = false }
objc2-web-kit = { version = "0.3", default-features = false }
tempfile = "3"
webview2-com = "0.38"
windows = "0.61"
windows-core = "0.61"
windows-version = "0.1"
glib = "0.18"
gtk = "0.18"
webkit2gtk = "2.0"

# Windows-specific dependencies
win32job = "2.0"

# I18n internationalization
fluent-bundle = "0.15"
unic-langid = "0.9"

# Encryption (Remote Connect E2E)
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
aes-gcm = "0.10"
sha2 = "0.10"
hkdf = "0.12"
minisign-verify = "0.2"
sha1 = "0.10"
argon2 = "0.5"
rand = "0.8"

# Device/Network info (Remote Connect)
mac_address = "1.1"
local-ip-address = "0.6"
hostname = "0.4"

# QR code generation
qrcode = { version = "0.14", default-features = false }

# WebSocket client
tokio-tungstenite = { version = "0.29", default-features = false }
sioc = { version = "0.5.0", default-features = false }

# Local speech recognition
sherpa-onnx = "1.13.4"

# MCP and remote runtimes
# Keep RMCP's Reqwest TLS provider-neutral; services-core owns ring selection.
rmcp = { version = "1.7", default-features = false, features = [
    "auth",
    "base64",
    "client",
    "elicitation",
    "macros",
    "reqwest-tls-no-provider",
    "schemars",
    "server",
] }
agent-client-protocol = { version = "0.12", features = ["unstable"] }
russh = "0.45"
russh-sftp = "2.1"
russh-keys = "0.45"
shellexpand = "3"
rustls = { version = "0.23", default-features = false }

[patch.crates-io]
# Restore compatibility with Rust's never-type fallback in the Linux D-Bus calls.
screenshots = { path = "third_party/screenshots" }
# Keep Socket.IO on the product-owned ring provider; see the patch note.
eioc = { path = "third_party/eioc" }
# Restore macOS traffic-light geometry after the queued native style reset.
# See third_party/tao/OPENBITFUN-PATCH.md for the upstream source and removal condition.
tao = { path = "third_party/tao" }
# Keep macOS HTML drags in WebKit while preserving native file-drop paths.
# See third_party/wry/OPENBITFUN-PATCH.md for source and removal conditions.
wry = { path = "third_party/wry" }
# Tauri 2.11 loses keyboard focus for child webviews after Windows reactivates
# an `unstable` multi-webview window. Use the upstream fix until released;
# this revision also adopts tao 0.36, which includes the Windows input deadlock fix.
tauri-runtime = { git = "https://github.com/tauri-apps/tauri.git", rev = "7cc68e74ff6981f5c50a52a67d56c5eb2d227188" }
tauri-runtime-wry = { git = "https://github.com/tauri-apps/tauri.git", rev = "7cc68e74ff6981f5c50a52a67d56c5eb2d227188" }
tauri-utils = { git = "https://github.com/tauri-apps/tauri.git", rev = "7cc68e74ff6981f5c50a52a67d56c5eb2d227188" }

[profile.dev]
# Line tables only: keeps panic backtrace line numbers while shrinking PDB/DWARF
# output dramatically, which speeds up the Windows link step the most.
# Need full debug info for a debugger session? Override per-invocation with
# CARGO_PROFILE_DEV_DEBUG=2.
debug = "line-tables-only"

[profile.release]
opt-level = 3
# Thin LTO instead of fat LTO: 30-60% faster release codegen/link for ~0-2%
# runtime cost. This was already proven on the Linux aarch64 packaging runner.
# NOTE: needs one packaging regression round across all platforms (medium risk).
lto = "thin"
codegen-units = 1
strip = true
# Keep unwinding enabled for scoped `catch_unwind` recovery, such as the relay
# client's TLS connector construction. Aborting would turn those recoverable
# failures into process crashes.

[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
strip = false
incremental = true

# Build the window-only sidecar independently, including during Desktop dev.
# Never inherit Desktop's large debug artifact or its unified dependency features.
[profile.miniapp-shell]
inherits = "release"
opt-level = "z"
lto = "fat"
debug = false
strip = true
