# [upstream-sync] absorbed profiles (generated; do not edit by hand)
# Profiles the absorbed crates declare: a profile is a workspace-wide setting, so
# a crate root cargo would ignore carries each one here instead, and two trees that
# declare the same profile become one table rather than two answers to one setting.

[profile.dev]
# [upstream-sync] scripts/obf-upstream-manifest.toml and scripts/openalgo-desktop-upstream-manifest.toml both declare it: every key both declare holds the stricter of the two values, and a key only one declares stands as it is
debug = "line-tables-only"

[profile.release]
# [upstream-sync] scripts/obf-upstream-manifest.toml and scripts/openalgo-desktop-upstream-manifest.toml both declare it: every key both declare holds the stricter of the two values, and a key only one declares stands as it is
opt-level = 3
strip = true
lto = true
panic = "abort"
codegen-units = 1

[profile.release-fast]
# [upstream-sync] carried by scripts/obf-upstream-manifest.toml, the only tree that declares it
strip = false
lto = false
incremental = true
codegen-units = 16
inherits = "release"

[profile.miniapp-shell]
# [upstream-sync] carried by scripts/obf-upstream-manifest.toml, the only tree that declares it
opt-level = "z"
debug = false
strip = true
lto = "fat"
inherits = "release"

[profile.e2e]
# [upstream-sync] carried by scripts/openalgo-desktop-upstream-manifest.toml, the only tree that declares it
opt-level = 1
lto = false
codegen-units = 16
inherits = "release"

[profile.dev.package."*"]
# [upstream-sync] carried by scripts/openalgo-desktop-upstream-manifest.toml, the only tree that declares it
debug = false

[profile.dev.package.argon2]
# [upstream-sync] carried by scripts/openalgo-desktop-upstream-manifest.toml, the only tree that declares it
opt-level = 3

[profile.dev.package.blake2]
# [upstream-sync] carried by scripts/openalgo-desktop-upstream-manifest.toml, the only tree that declares it
opt-level = 3

[profile.dev.package.zeroize]
# [upstream-sync] carried by scripts/openalgo-desktop-upstream-manifest.toml, the only tree that declares it
opt-level = 3
# [upstream-sync] absorbed profiles end
